<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa Fácil — Reservas por chat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-alt: #16213a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #f97316;
        --accent-contrast: #1a0d02;
        --bubble-user: #2563eb;
        --bubble-bot: #334155;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, var(--bg), #0b1220);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: var(--text);
        padding: 24px;
      }

      main {
        width: 100%;
        max-width: 480px;
        background: var(--panel);
        border-radius: var(--radius);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 640px;
      }

      header {
        padding: 20px 24px;
        background: var(--panel-alt);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      header h1 {
        margin: 0;
        font-size: 1.15rem;
      }

      header p {
        margin: 4px 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }

      #log {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .msg {
        max-width: 78%;
        padding: 10px 14px;
        border-radius: var(--radius);
        line-height: 1.4;
        font-size: 0.95rem;
        white-space: pre-wrap;
      }

      .msg.bot {
        align-self: flex-start;
        background: var(--bubble-bot);
        border-bottom-left-radius: 4px;
      }

      .msg.user {
        align-self: flex-end;
        background: var(--bubble-user);
        border-bottom-right-radius: 4px;
      }

      .msg.pending {
        opacity: 0.6;
        font-style: italic;
      }

      form {
        display: flex;
        gap: 8px;
        padding: 16px;
        background: var(--panel-alt);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      input[type='text'] {
        flex: 1;
        border: none;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 0.95rem;
        background: #0b1220;
        color: var(--text);
      }

      input[type='text']:focus {
        outline: 2px solid var(--accent);
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 0 18px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-weight: 600;
        cursor: pointer;
        font-size: 0.95rem;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f1f5f9;
          --panel: #ffffff;
          --panel-alt: #f8fafc;
          --text: #0f172a;
          --muted: #64748b;
          --bubble-user: #2563eb;
          --bubble-bot: #e2e8f0;
        }

        .msg.bot {
          color: #0f172a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Mesa Fácil</h1>
        <p>Reserve, cancele ou consulte horários conversando naturalmente.</p>
      </header>
      <div id="log"></div>
      <form id="chat-form">
        <input id="message" type="text" placeholder="Ex.: quero reservar pra 4 pessoas sexta às 20h" autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
    </main>

    <script>
      const sessionId = crypto.randomUUID();
      const log = document.getElementById('log');
      const form = document.getElementById('chat-form');
      const input = document.getElementById('message');

      function addMessage(text, who) {
        const el = document.createElement('div');
        el.className = `msg ${who}`;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      addMessage('Olá! Posso ajudar a reservar uma mesa, cancelar uma reserva ou consultar horários. O que você precisa?', 'bot');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        input.value = '';
        input.disabled = true;

        const pending = addMessage('digitando…', 'bot pending');

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, message }),
          });

          if (!response.ok) {
            pending.textContent = 'Algo deu errado ao falar com o servidor. Tente de novo.';
            pending.classList.remove('pending');
            return;
          }

          const data = await response.json();
          pending.textContent = data.reply;
          pending.classList.remove('pending');
        } catch (err) {
          pending.textContent = 'Não consegui me conectar ao servidor. Tente de novo.';
          pending.classList.remove('pending');
        } finally {
          input.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
